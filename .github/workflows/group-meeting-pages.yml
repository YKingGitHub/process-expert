name: Deploy group meeting presentation

on:
  push:
    branches:
      - agent/group-meeting-webpage
    paths:
      - geometry-training-handoff/group_meeting_workflow.html
      - .github/workflows/group-meeting-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: group-meeting-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out presentation branch
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp geometry-training-handoff/group_meeting_workflow.html _site/index.html
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
