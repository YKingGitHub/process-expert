<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Process Expert 项目周报归档：几何提取器、Workflow 与验收模块的阶段性进展。">
  <title>Process Expert 周报</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --panel: #f7f9fc;
      --accent: #2457a6;
      --accent-soft: #eef4ff;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--white);
      font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    a { color: inherit; }

    .page {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .repo-link {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }

    .repo-link:hover { color: var(--accent); }

    .hero { padding: 54px 0 34px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 7vw, 62px);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    .lead {
      max-width: 760px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 18px;
    }

    .strategy {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    .strategy span {
      text-align: center;
      font-weight: 700;
    }

    .strategy .fixed { color: var(--accent); }
    .strategy .arrow { color: #98a2b3; }

    section { margin-top: 38px; }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.025em;
    }

    .count { color: var(--muted); font-size: 14px; }

    .latest-card {
      display: grid;
      grid-template-columns: 190px 1fr auto;
      gap: 28px;
      align-items: center;
      padding: 26px;
      border: 1px solid #bfd0ee;
      border-radius: 14px;
      background: var(--accent-soft);
    }

    .week {
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .date { margin-top: 5px; color: var(--muted); }

    .latest-card h3,
    .report-card h3 {
      margin: 0;
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .latest-card h3 { font-size: 23px; }

    .summary {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 8px;
      color: var(--white);
      background: var(--accent);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .button:hover { background: #184887; }

    .report-list {
      display: grid;
      gap: 12px;
    }

    .report-card {
      display: grid;
      grid-template-columns: 160px 1fr 120px;
      gap: 24px;
      align-items: center;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 11px;
      text-decoration: none;
      transition: border-color 120ms ease, background 120ms ease;
    }

    .report-card:hover {
      border-color: #a8bddf;
      background: #fbfcff;
    }

    .report-card h3 { font-size: 18px; }

    .open {
      color: var(--accent);
      font-weight: 700;
      text-align: right;
    }

    .error {
      padding: 18px;
      border: 1px solid #f0c9c5;
      border-radius: 10px;
      color: #8f2720;
      background: #fff7f6;
    }

    footer {
      margin-top: 46px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 28px, 1040px); padding-top: 22px; }
      .hero { padding-top: 38px; }
      .strategy { grid-template-columns: 1fr; }
      .strategy .arrow { transform: rotate(90deg); }
      .latest-card,
      .report-card { grid-template-columns: 1fr; gap: 14px; }
      .latest-card .button { justify-self: start; }
      .open { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">Process Expert</div>
      <a class="repo-link" href="https://github.com/YKingGitHub/process-expert">查看 GitHub 仓库</a>
    </header>

    <div class="hero">
      <p class="eyebrow">Weekly archive · 2026</p>
      <h1>项目周报</h1>
      <p class="lead">记录从三视图几何提取、工艺 Workflow 到双维度验收的每周实验进展与阶段结论。</p>
      <div class="strategy" aria-label="项目总体策略">
        <span class="fixed">① 固定几何提取器</span>
        <span class="arrow">→</span>
        <span>② 数据驱动优化 Workflow</span>
        <span class="arrow">→</span>
        <span class="fixed">③ 固定验收器</span>
      </div>
    </div>

    <section aria-labelledby="latest-title">
      <div class="section-head">
        <h2 id="latest-title">最新周报</h2>
      </div>
      <div id="latest-report" aria-live="polite">
        <div class="latest-card">
          <div><div class="week">正在读取</div></div>
          <div><h3>加载周报清单…</h3></div>
        </div>
      </div>
    </section>

    <section aria-labelledby="archive-title">
      <div class="section-head">
        <h2 id="archive-title">历期周报</h2>
        <span class="count" id="report-count"></span>
      </div>
      <div class="report-list" id="report-list"></div>
      <noscript>
        <p class="error">请启用 JavaScript 读取周报清单，或直接打开
          <a href="./geometry-training-handoff/view_agent/REPORT_33_SINGLE_SOLIDS_TOK4096.html">最新测试报告</a>。
        </p>
      </noscript>
    </section>

    <footer>首页由周报清单自动生成；新增周报后，历史入口会继续保留。</footer>
  </main>

  <script>
    const manifestUrl = "./geometry-training-handoff/weekly-reports/reports.json";
    const latestRoot = document.querySelector("#latest-report");
    const listRoot = document.querySelector("#report-list");
    const countRoot = document.querySelector("#report-count");

    function reportUrl(source) {
      return new URL(`./${source}`, window.location.href).href;
    }

    function textNode(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = value;
      return node;
    }

    function renderLatest(report) {
      const card = document.createElement("article");
      card.className = "latest-card";

      const meta = document.createElement("div");
      meta.append(textNode("div", "week", `${report.week} · LATEST`));
      meta.append(textNode("div", "date", report.date));

      const copy = document.createElement("div");
      copy.append(textNode("h3", "", report.title));
      copy.append(textNode("p", "summary", report.summary));

      const link = textNode("a", "button", "进入本周报告");
      link.href = reportUrl(report.source);

      card.append(meta, copy, link);
      latestRoot.replaceChildren(card);
    }

    function renderArchive(reports) {
      listRoot.replaceChildren();
      for (const report of reports) {
        const card = document.createElement("a");
        card.className = "report-card";
        card.href = reportUrl(report.source);

        const meta = document.createElement("div");
        meta.append(textNode("div", "week", report.week));
        meta.append(textNode("div", "date", report.date));

        const copy = document.createElement("div");
        copy.append(textNode("h3", "", report.title));
        copy.append(textNode("p", "summary", report.summary));

        card.append(meta, copy, textNode("div", "open", "打开周报 →"));
        listRoot.append(card);
      }
      countRoot.textContent = `共 ${reports.length} 期`;
    }

    fetch(manifestUrl, { cache: "no-cache" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((manifest) => {
        const reports = [...manifest.reports].sort((a, b) => b.date.localeCompare(a.date));
        if (!reports.length) throw new Error("周报清单为空");
        renderLatest(reports[0]);
        renderArchive(reports);
      })
      .catch((error) => {
        latestRoot.innerHTML = `<p class="error">周报清单加载失败：${error.message}</p>`;
        countRoot.textContent = "";
      });
  </script>
</body>
</html>
